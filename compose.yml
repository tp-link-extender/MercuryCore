# Config file for compose, a tool that allows for easily managing multiple containers.
# https://docs.docker.com/compose/

services:
    database:
        # not :nightly because doing that once caused failures when graph linking
        # and also caused errors with query parameters (twice)
        build: ./Database
        ports:
            - 127.0.0.1:8000:8000
        restart: unless-stopped
        volumes:
            - ./data/surreal:/database
        command:
            - start
            # :8000 (all interfaces) is needed for the Site container to reach it over the compose network; the host port stays loopback-only
            - --bind=0.0.0.0:8000
            - -u=root
            - -p=root
            - surrealkv://database

    economy:
        build: ./Economy
        ports:
            - 127.0.0.1:2009:2009
        environment:
            ECONOMY_KEY: ${ECONOMY_KEY:?set ECONOMY_KEY in a .env file next to compose.yml}
        restart: unless-stopped
        volumes:
            - ./data/economy:/data/economy

    site:
        build: .
        ports:
            # loopback only: Caddy on the host is the public entry point
            - 127.0.0.1:4443:4443
        restart: unless-stopped
        environment:
            # Caddy puts the client's address last in X-Forwarded-For, which is what ratelimits are keyed on
            ADDRESS_HEADER: X-Forwarded-For
            XFF_DEPTH: "1"
            ECONOMY_URL: http://economy:2009
            ECONOMY_KEY: ${ECONOMY_KEY:?set ECONOMY_KEY in a .env file next to compose.yml}
        depends_on:
            - database # will keep retrying until database is ready
            - economy
