<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>%sveltekit.error.message%</title>

	<style>
		body {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			height: 100vh;
			overflow: hidden;
			font-family: sans-serif;
			color: #f6f4f3;
			background: #100f0e;
		}

		#error {
			display: flex;
			align-items: center;
			max-width: 32rem;
			margin: 0 1rem;
		}

		#status {
			position: relative;
			top: -0.05rem;
			font-size: 3rem;
			font-weight: 200;
			line-height: 1;
		}

		#message {
			display: flex;
			align-items: center;
			min-height: 2.5rem;
			padding-left: 1rem;
			margin-left: 1rem;
			border-left: 1px solid #ccc;

			& h1 {
				margin: 0;
				font-size: 1em;
				font-weight: 400;
			}
		}
	</style>
</head>

<body>
	<div id="error">
		<span id="status">%sveltekit.status%</span>
		<div id="message">
			<h1>%sveltekit.error.message% :(</h1>
		</div>
	</div>
	<br>
	<a href="/">go home?</a>
</body>

</html>
